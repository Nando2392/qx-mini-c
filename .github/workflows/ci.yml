name: ci

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install tests
        run: python -m pip install pytest -r scripts/requirements-q8k-perf.txt
      - name: Build
        shell: cmd
        run: build_msvc.bat
      - name: Test
        run: python -m pytest tests -q
      - name: Wiki lint
        run: python scripts/lint_wiki.py
